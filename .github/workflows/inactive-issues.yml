
name: Archive inactive issues

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: archive-inactive-issues
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const dryRun = true;
            const inactiveDays = 365;
            const warningDays = 14;

            const pendingLabel = "pending-archive";
            const closedLabel = "long-inactive";
            const marker = "<!-- inactive-issue-warning-v1 -->";

            const { owner, repo } = context.repo;
            const now = Date.now();
            const day = 24 * 60 * 60 * 1000;

            const warning = `${marker}
            This issue has received no comments for 365 days.
            It will be automatically closed in 14 days
            unless someone adds a comment.`;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 }
            );

            let warned = 0;
            let closed = 0;
            let reactivated = 0;

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const number = issue.number;
              const labels = issue.labels.map(
                l => typeof l === "string" ? l : l.name
              );
              const pending = labels.includes(pendingLabel);

              const comments = issue.comments
                ? await github.paginate(
                    github.rest.issues.listComments,
                    {
                      owner, repo,
                      issue_number: number,
                      per_page: 100
                    }
                  )
                : [];

              const warnings = comments.filter(
                c => c.body?.includes(marker) &&
                  c.user?.login === "github-actions[bot]"
              );

              const normalComments = comments.filter(
                c => !warnings.some(w => w.id === c.id)
              );

              const lastActivity = Math.max(
                new Date(issue.created_at).getTime(),
                ...normalComments.map(
                  c => new Date(c.created_at).getTime()
                )
              );

              const lastWarning = warnings.length
                ? Math.max(...warnings.map(
                    c => new Date(c.created_at).getTime()
                  ))
                : 0;

              const inactive = now - lastActivity >= inactiveDays * day;
              const warningExpired =
                lastWarning &&
                now - lastWarning >= warningDays * day;

              const args = {
                owner, repo, issue_number: number
              };

              // A comment after the warning cancels closure.
              if (pending && lastActivity > lastWarning && lastWarning) {
                console.log(`#${number}: Reactivated`);
                reactivated++;
                if (!dryRun) {
                  await github.rest.issues.removeLabel({
                    ...args, name: pendingLabel
                  });
                }
                continue;
              }

              // A recent comment means the issue stays open.
              if (!inactive) {
                if (pending) {
                  console.log(`#${number}: Remove pending label`);
                  reactivated++;
                  if (!dryRun) {
                    await github.rest.issues.removeLabel({
                      ...args, name: pendingLabel
                    });
                  }
                }
                continue;
              }

              // Close only after an actual warning period.
              if (pending && lastWarning && warningExpired) {
                console.log(`#${number}: CLOSE`);
                closed++;
                if (!dryRun) {
                  await github.rest.issues.addLabels({
                    ...args, labels: [closedLabel]
                  });
                  await github.rest.issues.update({
                    ...args, state: "closed",
                    state_reason: "not_planned"
                  });
                }
                continue;
              }

              // Warn when no active warning is in effect.
              if (!pending || !lastWarning) {
                console.log(`#${number}: WARN`);
                warned++;
                if (!dryRun) {
                  await github.rest.issues.addLabels({
                    ...args, labels: [pendingLabel]
                  });
                  await github.rest.issues.createComment({
                    ...args, body: warning
                  });
                }
              }
            }

            console.log(`Issues examined: ${issues.length}`);
            console.log(`Warnings: ${warned}`);
            console.log(`Closures: ${closed}`);
            console.log(`Reactivated: ${reactivated}`);
            console.log(`Dry run: ${dryRun}`);
