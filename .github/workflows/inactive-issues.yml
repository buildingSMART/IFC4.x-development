
name: Archive inactive issues

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 365
          days-before-issue-close: 14

          stale-issue-label: "pending-archive"
          close-issue-label: "long-inactive"

          stale-issue-message: >
            This issue has been inactive for 365 days.
            It will be automatically closed in 14 days
            unless there is new activity.

          remove-issue-stale-when-updated: true
          close-issue-reason: "not_planned"

          days-before-pr-stale: -1
          days-before-pr-close: -1

          operations-per-run: 100
          debug-only: true
