server {
    listen 80;
    listen [::]:80;
    server_name $DOMAIN;

    # Health probe: lets the certbot container detect that nginx is up
    # without having to interpret a 503 as an error.
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Used by certbot for the HTTP-01 (webroot) challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
